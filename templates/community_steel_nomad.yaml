# 3DMark Steel Nomad. Save as
# data/community/<gpu_id>/result_YYYYMMDD_steel_nomad.yaml,
# for example data/community/rtx_4070_super_12gb_fe/result_20261013_steel_nomad.yaml.
# Only gpu_id, game, result, system.os, and proof.method are required; the
# rest is optional, and you don't have to give your name.
# The folder name and gpu_id must exactly match a catalog ID, and it must be the
# GPU that ran the test. 3DMark lists every GPU in the machine under System
# information, so check that the first card is the one you mean.
# For other games, use community_submission.yaml; PresentMon is the recommended
# way to capture those.
#
# Steel Nomad has one graphics test, so its score is the average FPS times 100
# (a score of 8603 is 86.03 FPS). Copy avg_fps from the "Graphics test" box on
# the results page rather than dividing, and add the score too. 3DMark has no 1%
# low, so p1_low is left out. For benchmarks with more than one graphics test
# (such as Time Spy), enter the graphics-test FPS shown on the results page, not
# the overall score divided by 100.
gpu_id: rtx_4070_super_12gb_fe
# submitted_by: your-github-username # Optional; leave it out to stay anonymous
benchmark_type: game
game: 3DMark Steel Nomad
version: "1.0" # The benchmark version shown on the results page
frame_generation: false
form_factor: desktop
device_name: Ryzen 7 7800X3D test bench # Optional; encouraged for exact machine metadata
gpu_power_w: 220 # Optional for desktops; strongly encouraged for laptops
overclocked: false
result:
  - resolution: 1440p # Steel Nomad renders at a fixed resolution; use the one the benchmark states
    graphics_preset: Default # 3DMark runs a fixed preset
    avg_fps: 71.0 # "Graphics test" FPS on the results page
    score: 7100 # Optional; the Steel Nomad score
system:
  os: windows # Required: windows or linux
  os_detail: Windows 11 Pro 24H2
  cpu: AMD Ryzen 7 7800X3D
  memory: 32 GB DDR5
  driver: "561.09" # Optional; encouraged
  graphics_api: DX12
proof:
  # Required. Keep synthetic_benchmark for 3DMark and similar. For a game, see
  # community_submission.yaml for the capture tools you can pick from.
  method: synthetic_benchmark
  # Optional, but it's the easiest evidence: the link to your 3DMark result page.
  summary_source: https://www.3dmark.com/sn/1234567
