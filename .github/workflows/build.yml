
name: Build and Deploy Open GPU Benchmarks
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python scripts/build.py
      - run: python scripts/test_build.py
      # The blog (Astro) reads site/api/v1, so it builds after build.py.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm --prefix blog ci
      # Cloudflare (canonical) serves the blog at /blog/.
      - run: npm --prefix blog run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./site
      # The GitHub Pages mirror lives under /open-gpu-benchmarks/, so its blog
      # links need that prefix. Astro empties site/blog before rebuilding.
      - run: npm --prefix blog run build
        env:
          BLOG_BASE: /open-gpu-benchmarks/blog
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Pages serves the same build at https://opengpubenchmarks.com,
  # the canonical host. Direct Upload project; secrets set in the repo settings.
  deploy-cloudflare:
    environment:
      name: cloudflare-pages
      url: https://opengpubenchmarks.com
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ./site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=open-gpu-benchmarks --branch=main --commit-hash=${{ github.sha }}
