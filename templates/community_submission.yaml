# Submitting this file releases its contents into the public domain (CC0,
# see data/LICENSE): anyone can use the numbers for anything, without asking or
# crediting you. Only include what you're happy to make public.
#
# Save as data/community/<gpu_id>/result_YYYYMMDD_<game>.yaml,
# for example data/community/rtx_5080_16gb_fe/result_20261003_cyberpunk.yaml.
# For a second file with the same date and game, add a number:
# result_20261003_cyberpunk_2.yaml.
# The folder name and gpu_id must exactly match a catalog ID: the file name of
# the product's entry under data/gpus/<form_factor>/<gpu_vendor>/. The ID names
# the exact product, including memory size; use the one you tested.
#
# Only the fields marked Required are needed. Everything else is optional:
# share it if you want to, or delete it. You don't have to give your name.
#
# Found these numbers in a video, review, or post instead of running them
# yourself? Start from community_found_result.yaml.
# Ran Cyberpunk 2077's built-in benchmark? scripts/import_cyberpunk.py writes
# these files for you; see docs/CYBERPUNK_BENCHMARK.md.
#
# result is a YAML list. Keep the leading "-" for every benchmark profile:
# it lets one file contain different resolutions or presets without duplicate
# YAML keys. Every list item is validated and aggregated independently.
gpu_id: rtx_5080_16gb_fe # Required
game: Cyberpunk 2077 # Required
result: # Required; one "-" item per resolution/preset
  - resolution: 1440p # Required
    graphics_preset: "Ray Tracing: Ultra" # Required; the preset name the game shows
    upscaling: DLSS Auto # Only because this preset turns DLSS on by itself
    preset_upscaling: true
    avg_fps: 79.1 # Required
    p1_low: 65.0 # Required when proof.method records every frame (see below)
    p5_low: 68.2 # Optional from PresentMon
  - resolution: 1080p
    graphics_preset: "Ray Tracing: Ultra"
    upscaling: DLSS Auto
    preset_upscaling: true
    avg_fps: 103.4
    p1_low: 84.7
system:
  os: windows # Required: windows or linux, lowercase. Windows and Linux runs are never averaged together.
  # Everything else under system: is optional.
  os_detail: Windows 11 Pro 24H2 # The full OS name and version
  cpu: AMD Ryzen 7 7800X3D
  memory: 32 GB DDR5
  driver: "561.09"
  graphics_api: DX12 # DX12, DX11, or Vulkan
  # More optional machine fields: power_mode, display_mode, resizable_bar (true or false).
  # Optional Windows-only fields: game_mode, hags, memory_integrity (true or false), power_plan.
  #
  # On Linux, set os: linux and use the Linux-only fields instead, for example:
  #   os: linux
  #   os_detail: SteamOS 3.6.19
  #   distro: SteamOS
  #   distro_version: "3.6.19"
  #   kernel: "6.5.0-valve22"
  #   driver: Mesa 24.1.0
  #   mesa: "24.1.0"
  #   runtime: proton # native, proton, or wine
  #   proton: GE-Proton9-20
  #   dxvk: "2.4"
  #   vkd3d_proton: "2.13"
  #   launcher: Steam
  #   session: gamescope
  #   gamemode: true
  # Windows-only fields on a linux run, or Linux-only fields on a windows run, fail the checks.
proof:
  # Required. How the numbers were captured. Pick the tool you used.
  # These report a 1% low, so p1_low is required with them:
  #   presentmon          PresentMon (recommended)
  #   capframex           CapFrameX
  #   frameview           NVIDIA FrameView
  #   msi_afterburner     MSI Afterburner / RivaTuner (RTSS) benchmark
  #   mangohud            MangoHud (Linux)
  #   ocat                OCAT
  # These may report only an average, so p1_low is optional (add it if you have it):
  #   amd_adrenalin       AMD Software: Adrenalin Edition performance metrics
  #   in_game_benchmark   the game's own benchmark tool
  #   synthetic_benchmark 3DMark and similar (see community_steel_nomad.yaml)
  #   other               anything else; name it in the pull request
  method: presentmon
  # Optional evidence. A raw capture lets a reviewer check the numbers; runs with
  # no evidence are shown as "Unverified". Keep raw captures in this GPU folder,
  # such as data/community/rtx_5080_16gb_fe/raw/cyberpunk_1440p.csv.
  # Raw logs can contain your PC name or file paths; check before you commit.
  # raw_log: raw/cyberpunk_1440p.csv
  # format: presentmon_summary
  # summary_source: Link to a screenshot or a published summary
#
# Upscaling (DLSS, FSR, XeSS) is off by default; leave it off when you benchmark.
# Only when the graphics preset turns it on by itself, record it on that result
# item and say the preset did it:
#     upscaling: DLSS Quality
#     preset_upscaling: true
#
# All optional:
# submitted_by: your-github-username # Your GitHub username, shown as @you. Leave it out to stay anonymous.
# frame_generation: false # The default. Runs with frame generation on aren't accepted.
# version: "2.12" # Game version
# device_name: Ryzen 7 7800X3D test bench # Exact card, laptop, or device
# gpu_power_w: 220 # The power the GPU ran at; strongly encouraged for laptops, which are grouped by it
# overclocked: false
