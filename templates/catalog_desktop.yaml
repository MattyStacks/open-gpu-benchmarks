# Desktop card catalog entry. Rules: data/gpus/README.md
#
# Save as data/gpus/desktop/<gpu_vendor>/<id>.yaml, for example
# data/gpus/desktop/nvidia/rtx_5060_ti_16gb_msi_ventus_2x.yaml.
#
# The example values are the RTX 4070 Super Founders Edition. Replace them all.
# Only the fields marked "required" must be filled in. Delete any optional line
# you don't know; the dashboard shows "—" for it. Keep block style: one "-"
# line per list item, no [ ] or { }. Quote dates and version numbers.
#
# id pattern: <gpu_model>_<vram>gb_<brand>_<product_line>
#   rtx_5060_ti_8gb_msi_ventus_2x_oc, rtx_5060_ti_16gb_asus_tuf_gaming
#   GPU vendor's own card: _fe (NVIDIA), _reference (AMD), _le (Intel)
#
# base: the reference file with the GPU's shared specs (silicon, memory, clocks,
# TDP, features). Everything in it is copied into this card, and anything you
# write here wins. Create the reference first if it doesn't exist
# (templates/catalog_reference.yaml), or leave base out and fill every section.
id: rtx_4070_super_12gb_fe       # required; also the file name
base: rtx_4070_super_12gb        # optional; a file name under data/gpus/reference/
identity:
  name: GeForce RTX 4070 Super Founders Edition   # required; the retail name
  gpu_vendor: nvidia             # required; nvidia, amd, or intel (also the folder)
  board_partner: NVIDIA          # who made the board: MSI, ASUS, Sapphire, ...
classification:
  form_factor: desktop           # required
# Override reference values only where this board differs, for example a factory OC:
# clocks:
#   boost_mhz: 2610
power:
  connectors:
    - 16-pin 12VHPWR
release:
  date: '2024-01-17'
  msrp_usd: 599
  msrp_history:
    - date: '2024-01'
      price_usd: 599
features:
  outputs:
    - HDMI 2.1a
    - DP 1.4a x3
# skus:                          # retail names or part numbers with identical specs
#   - <part number>
notes: One or two sentences about what makes this card notable.
# Where this card's own details came from (release, connectors, outputs, price).
# The reference's sources are added automatically; list only the pages you used.
sources:
  - url: https://www.techpowerup.com/gpu-specs/geforce-rtx-4070-super.c4186
    title: TechPowerUp GPU Database - GeForce RTX 4070 SUPER
    accessed: '2026-10-08'
    covers:
      - release
      - power
      - features
