name: Validate
# Three separate checks so a pull request shows exactly which part failed.
# There is no paths filter on purpose: a required check that is skipped never
# reports, and that blocks the merge. Each job finishes in seconds.
on:
  pull_request:
  workflow_dispatch:

jobs:
  catalog:
    name: Catalog entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml numpy
      - run: python scripts/validate.py catalog

  results:
    name: Benchmark results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml numpy
      - run: python scripts/validate.py results

  build:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml numpy
      - run: python -m py_compile scripts/checks.py scripts/build.py scripts/validate.py scripts/parse.py scripts/test_build.py
      - run: python scripts/build.py
      - run: python scripts/test_build.py
