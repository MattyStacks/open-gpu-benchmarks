# Handheld catalog entry. Rules: data/gpus/README.md
#
# Save as data/gpus/handheld/<gpu_vendor>/<id>.yaml, for example
# data/gpus/handheld/amd/rog_ally_x_z1_extreme_24gb.yaml.
#
# The example values are the ROG Ally Z1 Extreme with 16 GB. Replace them all.
# Only the fields marked "required" must be filled in. Delete any optional line
# you don't know; the dashboard shows "—" for it. Keep block style: one "-"
# line per list item, no [ ] or { }. Quote dates and version numbers.
#
# id pattern: <device>_<chip>_<ram>gb, ending with the RAM size
#   legion_go_z1_extreme_16gb, rog_ally_x_z1_extreme_24gb
#   Leave out <chip> only if the device was only ever sold with one chip:
#   steam_deck_oled_16gb
# Handheld RAM is soldered, so each RAM size is its own entry and its own id.
#
# base: the chip's reference file (silicon, clocks, features). The RAM size,
# type, and bandwidth are the device maker's choice, so they go here.
id: rog_ally_z1_extreme_16gb     # required; also the file name
base: z1_extreme                 # optional; a file name under data/gpus/reference/
identity:
  name: ROG Ally Z1 Extreme      # required
  gpu_vendor: amd                # required; the chip maker, not the device maker
classification:
  form_factor: handheld          # required
memory:
  capacity_gb: 16                # required; system RAM, must equal the <N>gb in the id
  type: LPDDR5
  bandwidth_gbs: 102.4
platform:                        # the device's own specs (all optional)
  oem: ASUS
  cpu: Zen 4 8C/16T
  ram_mts: 6400                  # RAM speed; slower RAM means lower FPS
  os_shipped: Windows 11
  display: 7 in 1920x1080 120 Hz
  power_min_w: 9                 # APU power range
  power_max_w: 30
release:
  date: '2023-06-13'
  msrp_usd: 699
  msrp_history:
    - date: '2023-06'
      price_usd: 699
notes: Custom Phoenix APU with 12 CUs. Memory is shared system RAM.
# Where the device specs came from, usually the maker's spec page. The chip
# reference's sources are added automatically.
sources:
  - url: https://rog.asus.com/us/gaming-handhelds/rog-ally/rog-ally-2023/spec/
    title: ASUS ROG Ally (2023) RC71L tech specs
    accessed: '2026-10-08'
    covers:
      - memory
      - platform
