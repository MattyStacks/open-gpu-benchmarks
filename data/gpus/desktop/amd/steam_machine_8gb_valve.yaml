notes: >-
  Valve's living-room PC with a semi-custom AMD RDNA 3 GPU (28 compute units,
  comparable to the Radeon RX 7600M) and 8 GB of GDDR6, next to a 6-core Zen 4
  CPU. Listed as a desktop because the GPU only ships inside this machine;
  Mesa reports it as "AMD Steam Machine (RADV NAVI33)". System RAM is upgradeable (two
  SO-DIMM slots), so it's recorded per run and each RAM setup is its own test
  bench.
