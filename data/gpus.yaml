# Authoritative GPU catalog. Each entry keeps its short `id` at the top level
# (result folders and `gpu_id` fields reference it) with hardware specs in
# nested sections. Quote every date: unquoted `2022-10-12` parses as a YAML
# timestamp instead of a string and fails validation.
#
# Required leaves: identity.{name, codename, vendor},
# classification.{form_factor, architecture}, memory.{capacity_gb, type,
# bus_width_bits, bandwidth_gbs}, clocks.{boost_mhz}, power.{tdp_w}.
# Everything else is optional but type- and range-checked when present.
# form_factor is one of: desktop, laptop, handheld, igpu.
- id: rtx_4090
  identity:
    name: GeForce RTX 4090
    codename: AD102
    vendor: nvidia
  classification:
    form_factor: desktop
    architecture: Ada Lovelace
  silicon:
    process: TSMC 4N
    die_size_mm2: 608.5
    transistors_b: 76.3
    shader_cores: 16384
    rt_cores: 128
    tmus: 512
    rops: 176
  memory:
    capacity_gb: 24
    type: GDDR6X
    bus_width_bits: 384
    bandwidth_gbs: 1008
  clocks:
    base_mhz: 2235
    boost_mhz: 2520
    mem_mhz: 1313
  power:
    tdp_w: 450
    connectors:
    - 16-pin 12VHPWR
    pcie: 4.0 x16
  release:
    date: '2022-10-12'
    msrp_usd: 1599
    msrp_history:
    - date: '2022-10'
      price_usd: 1599
  features:
    dlss: '3.5'
    fsr: '3.1'
    av1: encode+decode
    outputs:
    - HDMI 2.1a
    - DP 1.4a x3
  notes: Flagship Ada card. Very large cooler with headroom past 3 GHz when overclocked.

