notes: >-
  The original Steam Deck (64 GB, 256 GB, and 512 GB storage models), with the
  7 nm Aerith APU: Zen 2 4C/8T at 2.4-3.5 GHz and 8 RDNA 2 CUs at up to 1.6 GHz
  (1.6 TFLOPS FP32), and 16 GB of LPDDR5-5500 on four 32-bit channels. APU
  power spans 4-15 W. Storage size doesn't change the chip, so every LCD model
  is this one entry.
