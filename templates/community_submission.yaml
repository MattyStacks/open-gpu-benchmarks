# Save as data/community/<gpu_id>/result_YYYYMMDD_<game>_<github_username>.yaml,
# for example data/community/rtx_4070_super_12gb_fe/result_20261003_cyberpunk_mattystacks.yaml.
# The folder name and gpu_id must exactly match a catalog ID: the file name of
# the product's entry under data/gpus/<form_factor>/<gpu_vendor>/. The ID names
# the exact product, including memory size; use the one you tested.
# The file name must end with your GitHub username (lowercase is fine), and the
# same username goes in submitted_by. For a second file with the same date and
# game, add a number before the username: result_20261003_cyberpunk_2_mattystacks.yaml.
#
# result is a YAML list. Keep the leading "-" for every benchmark profile:
# it lets one file contain different resolutions or presets without duplicate
# YAML keys. Every list item is validated and aggregated independently.
gpu_id: rtx_4070_super_12gb_fe
submitted_by: your-github-username # Required; GitHub user opening the pull request
benchmark_type: game
game: Cyberpunk 2077
version: "2.12"
frame_generation: false
form_factor: desktop
device_name: Ryzen 7 7800X3D test bench # Optional; encouraged for exact machine metadata
gpu_power_w: 220 # Optional for desktops; strongly encouraged for laptops
overclocked: false
result:
  - resolution: 1440p
    graphics_preset: Ultra RT
    upscaling: DLSS Quality
    avg_fps: 79.1
    p1_low: 65.0
    p5_low: 68.2 # Optional from PresentMon
  - resolution: 1080p
    graphics_preset: Ultra RT
    upscaling: DLSS Quality
    avg_fps: 103.4
    p1_low: 84.7
system:
  os: windows # Required: windows or linux, lowercase. Windows and Linux runs are never averaged together.
  os_detail: Windows 11 Pro 24H2 # Optional; the full OS name and version
  cpu: AMD Ryzen 7 7800X3D
  memory: 32 GB DDR5
  power_mode: Performance
  display_mode: direct
  driver: "561.09" # Optional; encouraged but not required for review
  graphics_api: DX12 # Optional; DX12, DX11, or Vulkan
  resizable_bar: true # Optional
  # Optional Windows-only fields: game_mode, hags, memory_integrity (true or false), power_plan.
  #
  # On Linux, set os: linux and use the Linux-only fields instead, for example:
  #   os: linux
  #   os_detail: SteamOS 3.6.19
  #   distro: SteamOS
  #   distro_version: "3.6.19"
  #   kernel: "6.5.0-valve22"
  #   driver: Mesa 24.1.0
  #   mesa: "24.1.0"
  #   runtime: proton # native, proton, or wine
  #   proton: GE-Proton9-20
  #   dxvk: "2.4"
  #   vkd3d_proton: "2.13"
  #   launcher: Steam
  #   session: gamescope
  #   gamemode: true
  # Windows-only fields on a linux run, or Linux-only fields on a windows run, fail the checks.
proof:
  # Keep raw captures in this GPU folder, such as
  # data/community/rtx_4070_super_12gb_fe/raw/Cyberpunk_4070S_1440p.csv.
  raw_log: raw/Cyberpunk_4070S_1440p.csv
  format: presentmon_summary
  # If a raw log is unavailable, remove raw_log and provide a clear source.
  # summary_source: Screenshot or manually recorded benchmark summary
